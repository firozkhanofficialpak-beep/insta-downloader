<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta Reel Downloader — Public Video Downloader</title>
    <meta name="description" content="Download publicly accessible Instagram Reels and videos. Fast, clean, and mobile-friendly.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.85);
            --success-color: #10b981;
            --error-color: #ef4444;
            --accent: #f093fb;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background orbs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #667eea;
            top: -100px;
            left: -100px;
            animation: float1 15s ease-in-out infinite;
        }

        body::after {
            width: 500px;
            height: 500px;
            background: #f093fb;
            bottom: -150px;
            right: -150px;
            animation: float2 18s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, 60px) scale(1.1); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-80px, -60px) scale(1.15); }
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 560px;
            position: relative;
            z-index: 1;
            animation: containerFadeIn 0.8s ease-out;
        }

        @keyframes containerFadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Ad banner container */
        .ad-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            min-height: 50px;
            width: 100%;
            padding: 0 8px;
        }

        .ad-container iframe,
        .ad-container img,
        .ad-container script {
            max-width: 100% !important;
            border-radius: 8px;
        }

        /* Glass card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            padding: 32px 28px;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: var(--primary-gradient);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(240, 147, 251, 0.4);
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 24px rgba(240, 147, 251, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 12px 32px rgba(240, 147, 251, 0.6); }
        }

        .logo-icon svg {
            width: 34px;
            height: 34px;
            fill: white;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Input group */
        .input-group {
            margin-bottom: 16px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 16px 18px;
            padding-right: 100px;
            font-size: 0.95rem;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            outline: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        .input-wrapper input:focus {
            border-color: rgba(240, 147, 251, 0.6);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(240, 147, 251, 0.15);
        }

        .paste-btn {
            position: absolute;
            right: 6px;
            padding: 8px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .paste-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .paste-btn:active {
            transform: translateY(0);
        }

        /* Download button */
        .download-btn {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            background: var(--primary-gradient);
            background-size: 200% 200%;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            font-family: inherit;
            letter-spacing: 0.3px;
            animation: gradientShift 4s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .download-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(240, 147, 251, 0.4);
        }

        .download-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .download-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .download-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        /* Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Result card */
        .result-card {
            margin-top: 20px;
            padding: 20px;
            border-radius: 16px;
            animation: slideIn 0.4s ease-out;
            display: none;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-card.success {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: block;
        }

        .result-card.error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            display: block;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .result-header.success {
            color: #6ee7b7;
        }

        .result-header.error {
            color: #fca5a5;
        }

        .result-header svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .video-preview {
            width: 100%;
            max-height: 400px;
            border-radius: 12px;
            margin-bottom: 14px;
            background: #000;
            display: block;
        }

        .download-mp4-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .download-mp4-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        .download-mp4-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        .error-message {
            font-size: 0.9rem;
            color: #fecaca;
            line-height: 1.5;
        }

        /* Footer note */
        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.5;
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 12px;
                align-items: flex-start;
                padding-top: 20px;
            }

            .glass-card {
                padding: 24px 20px;
                border-radius: 20px;
            }

            .header h1 {
                font-size: 1.35rem;
            }

            .header p {
                font-size: 0.85rem;
            }

            .logo-icon {
                width: 56px;
                height: 56px;
            }

            .logo-icon svg {
                width: 30px;
                height: 30px;
            }

            .input-wrapper input {
                padding: 14px 16px;
                padding-right: 92px;
                font-size: 0.9rem;
            }

            .paste-btn {
                padding: 7px 12px;
                font-size: 0.75rem;
            }

            .download-btn {
                padding: 15px;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 360px) {
            .paste-btn {
                padding: 6px 10px;
                font-size: 0.7rem;
            }

            .input-wrapper input {
                padding-right: 84px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Adsterra 320x50 Banner -->

        <div class="glass-card">

                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                    </svg>

            <div class="input-group">

                    <input
                        type="url"
                        id="urlInput"
                        placeholder="Paste Instagram Reel URL here..."
                        autocomplete="off"

                    >

    <script>
        (function() {
            'use strict';

            const urlInput = document.getElementById('urlInput');
            const pasteBtn = document.getElementById('pasteBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const resultCard = document.getElementById('resultCard');
            const resultHeader = document.getElementById('resultHeader');
            const resultBody = document.getElementById('resultBody');

            const ICON_DOWNLOAD = '<path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/>';
            const ICON_SUCCESS = '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>';
            const ICON_ERROR = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>';

            let isLoading = false;

            // Paste from clipboard
            pasteBtn.addEventListener('click', async function() {
                try {
                    if (navigator.clipboard && navigator.clipboard.readText) {
                        const text = await navigator.clipboard.readText();
                        urlInput.value = text.trim();
                        urlInput.focus();
                    } else {
                        urlInput.focus();
                        alert('Clipboard access is not supported. Please paste manually.');
                    }
                } catch (err) {
                    urlInput.focus();
                    alert('Could not read clipboard. Please paste manually.');
                }
            });

            // Allow Enter key to trigger download
            urlInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleDownload();
                }
            });

            // Clear result when typing
            urlInput.addEventListener('input', function() {
                hideResult();
            });

            downloadBtn.addEventListener('click', handleDownload);

            function setLoading(loading) {
                isLoading = loading;
                downloadBtn.disabled = loading;

                if (loading) {
                    btnIcon.outerHTML = '<div class="spinner" id="btnIcon"></div>';
                    btnText.textContent = 'Processing...';
                } else {
                    const spinner = document.getElementById('btnIcon');
                    if (spinner) {
                        spinner.outerHTML = '<svg id="btnIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' + ICON_DOWNLOAD + '</svg>';
                    }
                    btnText.textContent = 'Download Video';
                }
            }

            function hideResult() {
                resultCard.className = 'result-card';
                resultCard.style.display = 'none';
                resultHeader.innerHTML = '';
                resultBody.innerHTML = '';
            }

            function showError(message) {
                resultCard.className = 'result-card error';
                resultCard.style.display = 'block';
                resultHeader.className = 'result-header error';
                resultHeader.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor">' + ICON_ERROR + '</svg><span>Error</span>';
                resultBody.innerHTML = '<div class="error-message">' + escapeHtml(message) + '</div>';
            }

            function showSuccess(downloadUrl) {
                resultCard.className = 'result-card success';
                resultCard.style.display = 'block';
                resultHeader.className = 'result-header success';
                resultHeader.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor">' + ICON_SUCCESS + '</svg><span>Video Ready!</span>';

                const safeUrl = escapeHtml(downloadUrl);

                let bodyHtml = '';
                bodyHtml += '<video class="video-preview" controls preload="metadata" src="' + safeUrl + '"></video>';
                bodyHtml += '<a class="download-mp4-btn" href="' + safeUrl + '" download target="_blank" rel="noopener noreferrer">';
                bodyHtml += '<svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>';
                bodyHtml += 'Download MP4</a>';

                resultBody.innerHTML = bodyHtml;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            async function handleDownload() {
                if (isLoading) return;

                const url = urlInput.value.trim();

                if (!url) {
                    showError('Please enter an Instagram Reel or video URL.');
                    urlInput.focus();
                    return;
                }

                // Basic client-side validation
                const instaPattern = /^https?:\/\/(www\.)?instagram\.com\/(reel|p|tv)\/[a-zA-Z0-9_-]+\/?/;
                if (!instaPattern.test(url)) {
                    showError('Invalid URL. Please enter a valid public Instagram Reel, Post, or IGTV link.');
                    urlInput.focus();
                    return;
                }

                hideResult();
                setLoading(true);

                try {
                    const response = await fetch('/get-download-link', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify({ url: url })
                    });

                    const data = await response.json();

                    if (data.success && data.download_url) {
                        showSuccess(data.download_url);
                    } else {
                        showError(data.error || 'Unable to process this video. Please try again.');
                    }
                } catch (err) {
                    showError('Network error. Please check your connection and try again.');
                } finally {
                    setLoading(false);
                }
            }
        })();
    </script>
